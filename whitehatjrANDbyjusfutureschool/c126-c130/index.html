<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.0.0/p5.js"></script>
        
        <script src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.0.0/addons/p5.sound.min.js"></script>
      
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body background="background.png">
    <center>
        <h3 class="btn btn-warning heading">AI DJ Web App
            <br>
            <span class="note">Note - Move your left-hand wrist up and down to increase and decrease the volume, and move your right-hand wrist to increase and decrease the speed of the song.</span>
        </h3>
        <div class="div_speed">
            <img src="disc.gif" class="div_speed_img">
            <br>
            <h3 class="btn btn-danger" id="speed">Speed</h3>
        </div>
        <div class="div_volume">
            <img src="disc.gif" class="div_volume_img">
            <br>
            <h3 class="btn btn-danger" id="volume">Volume</h3>
        </div>
        <br><br>
        <button onclick="play();" class="btn btn-success play_button">Play</button>
    </center>
    <script src="main.js"></script>
    </body>
</html>
