<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        /* weather condition gradients */
        .weather-bg {
            transition: background 1s ease-in-out;
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* specific themes based on wmo codes - using only the provided themes */
        .theme-clear { background: linear-gradient(-45deg, #ff7e5f, #feb47b, #ffcb8c); }
        .theme-cloudy { background: linear-gradient(-45deg, #bdc3c7, #2c3e50, #4ca1af); }
        .theme-rain { background: linear-gradient(-45deg, #00416a, #799f0c, #2c3e50); }
        .theme-snow { background: linear-gradient(-45deg, #e6dada, #274046, #e6dada); }
        .theme-thunder { background: linear-gradient(-45deg, #141E30, #243B55, #485563); }
        .theme-fog { background: linear-gradient(-45deg, #3E5151, #DECBA4); }
        .theme-default { background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab); }

        /* background glass effect */
        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .glass-dark {
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* custom scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(255,255,255,0.3);
            border-radius: 20px;
        }

        /* loading spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* transitions */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen w-full text-white overflow-hidden relative theme-default weather-bg" id="appBody">

    <button id="menuBtn" class="absolute top-4 left-4 z-50 p-2 glass rounded-lg md:hidden hover:bg-white/20 transition">
        <i class="ph ph-list text-2xl"></i>
    </button>

    <div class="flex h-full w-full max-w-7xl mx-auto md:p-6 p-0 gap-6">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-80 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col glass rounded-r-2xl md:rounded-3xl shadow-2xl overflow-hidden h-full">
            
            <div class="p-6 border-b border-white/10">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold flex items-center gap-2">
                        <i class="ph ph-cloud-sun text-yellow-300"></i> Weather
                    </h2>
                    <button id="closeMenu" class="md:hidden p-1 hover:text-gray-300"><i class="ph ph-x text-xl"></i></button>
                </div>

                <div class="relative">
                    <div class="flex items-center glass-dark rounded-xl px-3 py-2">
                        <i class="ph ph-magnifying-glass text-gray-400"></i>
                        <input type="text" id="citySearch" placeholder="Search and select city..." class="bg-transparent border-none outline-none text-sm ml-2 w-full text-white placeholder-gray-400">
                        <div id="searchLoader" class="loader hidden" style="width: 16px; height: 16px; border-width: 2px;"></div>
                    </div>
                    <div id="searchResults" class="absolute top-full left-0 w-full glass-dark mt-2 rounded-xl overflow-hidden shadow-lg max-h-60 overflow-y-auto z-50">
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-2">
                
                <div class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-white/10 transition text-left group">
                    <button id="btnCurrentLoc" class="flex items-center gap-3 flex-1 text-left">
                        <div class="w-8 h-8 rounded-full bg-blue-500/30 flex items-center justify-center group-hover:bg-blue-500/50 transition">
                            <i class="ph ph-navigation-arrow text-blue-200"></i>
                        </div>
                        <div>
                            <p class="font-medium text-sm">Current Location</p>
                            <p class="text-xs text-white/60" id="currentLocName">Detecting...</p>
                        </div>
                    </button>
                    <button id="saveCurrentLocBtn" class="p-2 rounded-full bg-blue-500/30 hover:bg-blue-500/50 transition flex items-center justify-center text-white text-xs" title="Save Current Location">
                        <i id="saveCurrentLocIcon" class="ph ph-bookmark-simple text-sm"></i>
                    </button>
                </div>

                <div class="border-t border-white/10 my-2"></div>
                
                <div class="flex items-center justify-between px-2 mb-2">
                    <p class="text-xs font-semibold text-white/40 uppercase tracking-wider">My Saved Cities</p>
                    <div class="relative group/tooltip">
                        <button id="defaultCityInfoBtn" class="text-white/50 hover:text-white transition" title="Info about Default City">
                             <i class="ph ph-info text-sm"></i>
                        </button>
                        <div id="defaultCityTooltip" class="absolute right-0 top-full mt-2 w-64 p-3 glass-dark rounded-xl shadow-lg z-50 hidden text-left text-xs">
                            <button id="closeDefaultCityTooltip" class="absolute top-1 right-1 p-1 rounded-full hover:bg-white/10 transition" title="Close">
                                <i class="ph ph-x text-sm text-white/70"></i>
                            </button>
                            <p class="pr-6 pt-1">
                                This button (<i class="ph ph-star-four text-yellow-300 inline-block"></i>) sets the default city that loads when you first open the dashboard.
                            </p>
                            <p class="mt-2 text-white/50">
                                Click 'X' to dismiss this message.
                            </p>
                        </div>
                    </div>
                </div>

                <div id="savedCitiesList" class="space-y-1">
                    <p class="text-sm text-white/50 text-center p-4" id="loadingCities">Loading saved cities...</p>
                </div>
            </div>

            <div class="p-6 border-t border-white/10">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-medium text-white/80">Units</span>
                    <div class="flex bg-black/20 rounded-lg p-1">
                        <button id="unitC" class="px-3 py-1 rounded-md text-sm font-bold bg-white/20 text-white shadow-sm transition">°C</button>
                        <button id="unitF" class="px-3 py-1 rounded-md text-sm font-bold text-white/50 hover:text-white transition">°F</button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 h-full relative flex flex-col justify-between md:rounded-3xl overflow-hidden glass p-6 md:p-10 transition-all">
            
            <div class="flex-1 flex flex-col justify-center items-center text-center fade-in space-y-2 relative z-10 pt-10 md:pt-0">
                
                <div class="mb-4">
                    <h1 id="mainCity" class="text-4xl md:text-6xl font-bold tracking-tight">Loading...</h1>
                    <p id="mainDate" class="text-lg text-white/70 mt-2 font-light">--</p>
                </div>

                <div class="flex flex-col items-center">    
                    <div class="flex items-center justify-center gap-12">
                        <i id="weatherIcon" class="ph ph-sun text-[8rem] md:text-[10rem] drop-shadow-lg text-yellow-200"></i>
                        <div class="relative">
                            <span id="mainTemp" class="text-[6rem] md:text-[8rem] font-bold leading-none tracking-tighter">--</span>
                            <span class="text-3xl absolute top-4 -right-8">°</span>
                        </div>
                    </div>
                    <p id="weatherDesc" class="text-2xl font-medium text-white/90 capitalize mt-2">--</p>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full max-w-3xl mt-12">
                    <div class="glass-dark p-4 rounded-2xl flex flex-col items-center justify-center gap-1">
                        <i class="ph ph-wind text-2xl text-white/60"></i>
                        <span class="text-sm text-white/60">Wind</span>
                        <span id="statWind" class="font-bold text-lg">--</span>
                    </div>
                    <div class="glass-dark p-4 rounded-2xl flex flex-col items-center justify-center gap-1">
                        <i class="ph ph-drop text-2xl text-white/60"></i>
                        <span class="text-sm text-white/60">Humidity</span>
                        <span id="statHum" class="font-bold text-lg">--</span>
                    </div>
                    <div class="glass-dark p-4 rounded-2xl flex flex-col items-center justify-center gap-1">
                        <i class="ph ph-eye text-2xl text-white/60"></i>
                        <span class="text-sm text-white/60">Visibility</span>
                        <span id="statVis" class="font-bold text-lg">--</span>
                    </div>
                    <div class="glass-dark p-4 rounded-2xl flex flex-col items-center justify-center gap-1">
                        <i class="ph ph-thermometer text-2xl text-white/60"></i>
                        <span class="text-sm text-white/60">Feels Like</span>
                        <span id="statFeels" class="font-bold text-lg">--</span>
                    </div>
                </div>
            </div>

            <div class="absolute bottom-4 right-6 text-[10px] text-white/30 z-0">
                Weather Data by Open-Meteo
            </div>
        </main>

        <div id="overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>
    </div>

    <script>
    // city management
    const defaultCityData = { lat: 40.7128, lon: -74.0060, city: "New York", country: "USA", id: "40.7128--74.0060" };
    const state = {
        // use default city from storage, otherwise fallback to the hardcoded default
        defaultCity: JSON.parse(localStorage.getItem('defaultCity')) || {
            name: "New York",
            lat: 40.7128,
            lon: -74.0060,
            country: "USA",
            id: "40.7128--74.0060"
        },
        lat: 0, // will be set by initApp
        lon: 0, // will be set by initApp
        city: "", // will be set by initApp
        country: "", // will be set by initApp
        // load unit from local storage, default to 'c'
        unit: localStorage.getItem('weatherUnit') || 'c', 
        // load saved cities from local storage, default to empty array
        savedCities: JSON.parse(localStorage.getItem('savedCities') || '[]'), 
        currentLocation: null, // stores the last successfully detected location data
    };
    
    // set initial state from default city
    state.lat = state.defaultCity.lat;
    state.lon = state.defaultCity.lon;
    state.city = state.defaultCity.name;
    state.country = state.defaultCity.country;

    //  dom elements
    const els = {
        // main Display
        mainTemp: document.getElementById('mainTemp'),
        mainCity: document.getElementById('mainCity'),
        mainDate: document.getElementById('mainDate'),
        weatherIcon: document.getElementById('weatherIcon'),
        weatherDesc: document.getElementById('weatherDesc'),
        statWind: document.getElementById('statWind'),
        statHum: document.getElementById('statHum'),
        statVis: document.getElementById('statVis'),
        statFeels: document.getElementById('statFeels'),
        appBody: document.getElementById('appBody'),
        // sidebar
        unitC: document.getElementById('unitC'),
        unitF: document.getElementById('unitF'),
        searchInput: document.getElementById('citySearch'),
        searchResults: document.getElementById('searchResults'),
        searchLoader: document.getElementById('searchLoader'),
        savedCitiesList: document.getElementById('savedCitiesList'),
        loadingCities: document.getElementById('loadingCities'),
        // mobile ui
        sidebar: document.getElementById('sidebar'),
        menuBtn: document.getElementById('menuBtn'),
        closeMenu: document.getElementById('closeMenu'),
        overlay: document.getElementById('overlay'),
        // location
        btnCurrentLoc: document.getElementById('btnCurrentLoc'),
        currentLocName: document.getElementById('currentLocName'),
        saveCurrentLocBtn: document.getElementById('saveCurrentLocBtn'),
        saveCurrentLocIcon: document.getElementById('saveCurrentLocIcon'),
        // default city tooltip
        defaultCityInfoBtn: document.getElementById('defaultCityInfoBtn'),
        defaultCityTooltip: document.getElementById('defaultCityTooltip'),
        closeDefaultCityTooltip: document.getElementById('closeDefaultCityTooltip'),
    };

    // wmo weather codes mapping
    const weatherCodes = {
        0: { desc: "Clear Sky", icon: "ph-sun", theme: "theme-clear" },
        1: { desc: "Mainly Clear", icon: "ph-sun-dim", theme: "theme-clear" },
        2: { desc: "Partly Cloudy", icon: "ph-cloud-sun", theme: "theme-cloudy" },
        3: { desc: "Overcast", icon: "ph-cloud", theme: "theme-cloudy" },
        45: { desc: "Fog", icon: "ph-cloud-fog", theme: "theme-fog" },
        48: { desc: "Depositing Rime Fog", icon: "ph-cloud-fog", theme: "theme-fog" },
        51: { desc: "Light Drizzle", icon: "ph-cloud-rain", theme: "theme-rain" },
        53: { desc: "Moderate Drizzle", icon: "ph-cloud-rain", theme: "theme-rain" },
        55: { desc: "Dense Drizzle", icon: "ph-cloud-rain", theme: "theme-rain" },
        61: { desc: "Slight Rain", icon: "ph-cloud-rain", theme: "theme-rain" },
        63: { desc: "Moderate Rain", icon: "ph-cloud-rain", theme: "theme-rain" },
        65: { desc: "Heavy Rain", icon: "ph-cloud-rain", theme: "theme-rain" },
        71: { desc: "Slight Snow", icon: "ph-snowflake", theme: "theme-snow" },
        73: { desc: "Moderate Snow", icon: "ph-snowflake", theme: "theme-snow" },
        75: { desc: "Heavy Snow", icon: "ph-snowflake", theme: "theme-snow" },
        77: { desc: "Snow Grains", icon: "ph-snowflake", theme: "theme-snow" },
        80: { desc: "Slight Rain Showers", icon: "ph-cloud-rain", theme: "theme-rain" },
        81: { desc: "Moderate Rain Showers", icon: "ph-cloud-rain", theme: "theme-rain" },
        82: { desc: "Violent Rain Showers", icon: "ph-cloud-rain", theme: "theme-rain" },
        95: { desc: "Thunderstorm", icon: "ph-cloud-lightning", theme: "theme-thunder" },
        96: { desc: "Thunderstorm with Hail", icon: "ph-cloud-lightning", theme: "theme-thunder" },
        99: { desc: "Heavy Thunderstorm", icon: "ph-cloud-lightning", theme: "theme-thunder" }
    };

    // core functions

    function initUnitUI() {
        // toggle active unit button classes based on state
        const isF = state.unit === 'f';
        const activeClasses = ['bg-white/20', 'shadow-sm', 'text-white'];
        const inactiveClasses = ['text-white/50', 'hover:text-white'];
        
        [els.unitC, els.unitF].forEach(btn => {
            const isActive = (btn.id === 'unitF' && isF) || (btn.id === 'unitC' && !isF);
            btn.classList.toggle('bg-white/20', isActive);
            btn.classList.toggle('shadow-sm', isActive);
            btn.classList.toggle('text-white', isActive);
            btn.classList.toggle('text-white/50', !isActive);
            btn.classList.toggle('hover:text-white', !isActive);
        });
    }

    async function fetchWeather() {
        try {
            // display loading state
            els.mainCity.textContent = "Loading...";
            els.mainTemp.textContent = "--";

            // build url based on units
            const unitParam = state.unit === 'f' 
                ? '&temperature_unit=fahrenheit&wind_speed_unit=mph' 
                : '&temperature_unit=celsius&wind_speed_unit=kmh';
            
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${state.lat}&longitude=${state.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m&hourly=visibility${unitParam}&timezone=auto`;
            
            const response = await fetch(url);
            if (!response.ok) throw new Error("Weather API fetch failed.");
            
            const data = await response.json();
            
            updateUI(data);
        } catch (error) {
            console.error("Error fetching weather:", error);
            els.mainCity.innerText = "Fetch Error";
            els.mainTemp.textContent = "---";
        }
    }

    function updateUI(data) {
        const current = data.current;
        // fallback to the default 'Clear Sky' if code is unknown
        const weatherInfo = weatherCodes[current.weather_code] || weatherCodes[0]; 
        
        // text updates
        els.mainCity.textContent = state.city;
        els.mainTemp.textContent = Math.round(current.temperature_2m);
        els.weatherDesc.textContent = weatherInfo.desc;
        
        // stats
        const windUnit = state.unit === 'f' ? 'mph' : 'km/h';
        els.statWind.textContent = `${current.wind_speed_10m} ${windUnit}`;
        els.statHum.textContent = `${current.relative_humidity_2m}%`;
        els.statFeels.textContent = `${Math.round(current.apparent_temperature)}°`;
        
        // visibility (taken from first hour as approximation)
        const visMeters = data.hourly.visibility[0] || 0; 
        const visKm = (visMeters / 1000).toFixed(1);
        els.statVis.textContent = state.unit === 'f' 
            ? `${(visKm * 0.621371).toFixed(1)} mi` 
            : `${visKm} km`;

        // date
        const date = new Date();
        els.mainDate.textContent = date.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' });

        // visual theme update
        els.weatherIcon.className = `ph ${weatherInfo.icon} text-[8rem] md:text-[10rem] drop-shadow-lg ${current.is_day ? 'text-yellow-200' : 'text-blue-200'}`;
        
        // new theme classes
        els.appBody.className = els.appBody.className.replace(/theme-\w+/g, '');
        els.appBody.classList.add(weatherInfo.theme, 'weather-bg', 'h-screen', 'w-full', 'text-white', 'overflow-hidden', 'relative');

        // update current location favourite button state
        updateCurrentLocBtnState();
    }

    // geocoding & search

    async function searchCities(query) {
        els.searchResults.classList.add('hidden');
        if (!query || query.length < 2) {
            els.searchResults.innerHTML = '';
            return;
        }

        els.searchLoader.classList.remove('hidden');

        try {
            const url = `https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=5&language=en&format=json`;
            const res = await fetch(url);
            const data = await res.json();

            renderSearchResults(data.results || []);
        } catch (e) {
            console.error("Geocoding failed:", e);
        } finally {
            els.searchLoader.classList.add('hidden');
        }
    }

    function renderSearchResults(results) {
        els.searchResults.innerHTML = '';
        if (results.length === 0) {
            els.searchResults.classList.add('hidden');
            return;
        }

        els.searchResults.classList.remove('hidden');
        
        results.forEach(city => {
            // generate a unique ID for local storage
            const cityId = `${city.latitude.toFixed(4)}-${city.longitude.toFixed(4)}`; 
            const cityData = {
                name: city.name,
                lat: city.latitude,
                lon: city.longitude,
                country: city.country,
                admin1: city.admin1,
                id: cityId 
            };

            const isSaved = state.savedCities.some(c => c.id === cityData.id);

            const div = document.createElement('div');
            div.className = "p-3 hover:bg-white/10 cursor-pointer border-b border-white/5 last:border-0 flex justify-between items-center";
            div.innerHTML = `
                <div class="flex flex-col flex-1" data-id="${cityId}" data-lat="${cityData.lat}" data-lon="${cityData.lon}" data-name="${cityData.name}" data-country="${cityData.country}">
                    <span class="font-medium text-sm">${cityData.name}</span>
                    <span class="text-xs text-white/50">${cityData.admin1 || ''}, ${cityData.country}</span>
                </div>
                <button class="save-search-btn ml-4 p-2 rounded-full bg-blue-500/30 transition flex items-center justify-center text-white text-xs ${isSaved ? 'opacity-50 cursor-not-allowed' : 'hover:bg-blue-500/50'}" title="${isSaved ? 'City Already Saved' : 'Save City'}" ${isSaved ? 'disabled' : ''}>
                    <i class="ph ph-bookmark-simple text-sm"></i>
                </button>
            `;

            // attach event listener to the selectable area
            div.querySelector('div').addEventListener('click', (e) => {
                const target = e.currentTarget;
                selectLocation(target.dataset.name, parseFloat(target.dataset.lat), parseFloat(target.dataset.lon), target.dataset.country);
            });

            // attach event listener to the save button
            const saveBtn = div.querySelector('.save-search-btn');
            if (saveBtn && !isSaved) {
                saveBtn.addEventListener('click', () => {
                    saveCity(cityData);
                    els.searchResults.classList.add('hidden');
                    els.searchInput.value = '';
                    toggleMenu(false);
                });
            }

            els.searchResults.appendChild(div);
        });
    }

    function selectLocation(name, lat, lon, country, closeMenu = true) {
        state.city = name;
        state.lat = lat;
        state.lon = lon;
        state.country = country;
        fetchWeather();
        if (closeMenu) toggleMenu(false);
    }

    // location services

    function isCurrentLocSaved() {
        if (!state.currentLocation) return false;
        const currentId = `${state.currentLocation.lat.toFixed(4)}-${state.currentLocation.lon.toFixed(4)}`;
        return state.savedCities.some(c => c.id === currentId);
    }

    function updateCurrentLocBtnState() {
        if (!state.currentLocation) {
            els.saveCurrentLocBtn.style.display = 'none'; 
            return;
        }

        els.saveCurrentLocBtn.style.display = 'flex';
        const saved = isCurrentLocSaved();
        els.saveCurrentLocBtn.disabled = saved;
        
        els.saveCurrentLocIcon.classList.toggle('ph-bookmark-fill', saved);
        els.saveCurrentLocIcon.classList.toggle('ph-bookmark-simple', !saved);
        els.saveCurrentLocBtn.title = saved ? 'Current Location Saved' : 'Save Current Location';
        els.saveCurrentLocBtn.classList.toggle('opacity-50', saved);
        els.saveCurrentLocBtn.classList.toggle('cursor-not-allowed', saved);
        els.saveCurrentLocBtn.classList.toggle('hover:bg-blue-500/50', !saved);
    }

    function handleCurrentLocation() {
        els.currentLocName.textContent = "locating...";
        
        if (!navigator.geolocation) {
            els.currentLocName.textContent = "not supported";
            console.error("Geolocation is not supported by your browser");
            state.currentLocation = null;
            updateCurrentLocBtnState();
            return;
        }

        navigator.geolocation.getCurrentPosition(async (position) => {
            const { latitude, longitude } = position.coords;
            
            try {
                // reverse geocode using bigdatacloud
                const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
                const data = await res.json();
                
                const cityName = data.locality || data.city || "My Location";
                els.currentLocName.textContent = cityName;
                
                const currentId = `${latitude.toFixed(4)}-${longitude.toFixed(4)}`;
                
                // update state.currentLocation
                state.currentLocation = {
                    name: cityName,
                    lat: latitude,
                    lon: longitude,
                    country: data.countryName,
                    id: currentId
                };

                selectLocation(cityName, latitude, longitude, data.countryName);
                
            } catch (e) {
                // fallback if reverse geo fails
                const fallbackName = "Current Location";
                const currentId = `${latitude.toFixed(4)}-${longitude.toFixed(4)}`;
                state.currentLocation = {
                    name: fallbackName,
                    lat: latitude,
                    lon: longitude,
                    country: "",
                    id: currentId
                };
                selectLocation(fallbackName, latitude, longitude, "");
                els.currentLocName.textContent = `${latitude.toFixed(2)}, ${longitude.toFixed(2)}`;
            }
            updateCurrentLocBtnState();
            toggleMenu(false);
        }, () => {
            els.currentLocName.textContent = "permission denied";
            console.warn("Unable to retrieve your location (permission denied)");
            state.currentLocation = null;
            updateCurrentLocBtnState();
        });
    }

    function saveCurrentLocation() {
        if (!state.currentLocation || isCurrentLocSaved()) return;
        saveCity({ ...state.currentLocation });
    }

    // saved cities management

    function renderSavedCities() {
        els.savedCitiesList.innerHTML = '';
        els.loadingCities.classList.add('hidden');

        if (state.savedCities.length === 0) {
            els.savedCitiesList.innerHTML = '<p class="text-sm text-white/50 text-center p-4">No saved cities yet.</p>';
            return;
        }

        state.savedCities.forEach(city => {
            const isDefault = state.defaultCity.id === city.id;
            
            const div = document.createElement('div');
            div.className = "w-full flex items-center justify-between p-3 rounded-xl hover:bg-white/10 transition";
            div.innerHTML = `
                <button class="select-city-btn flex flex-col flex-1 text-left">
                    <span class="font-medium text-sm">${city.name} ${isDefault ? '<i class="ph ph-star-four text-yellow-300 ml-1"></i>' : ''}</span>
                    <span class="text-xs text-white/60">${city.country}</span>
                </button>
                <div class="flex items-center space-x-2">
                    <button class="set-default-btn p-2 rounded-full transition text-xs ${isDefault ? 'bg-yellow-500/50 text-white cursor-default' : 'hover:bg-yellow-500/30 text-yellow-300'}" 
                            data-id="${city.id}" 
                            title="${isDefault ? 'Default City' : 'Set as Default City'}"
                            ${isDefault ? 'disabled' : ''}>
                        <i class="ph ph-star-four text-sm"></i>
                    </button>
                    <button class="delete-city-btn p-2 rounded-full hover:bg-red-500/50 transition text-white text-xs" data-id="${city.id}" title="Delete City">
                        <i class="ph ph-trash text-sm"></i>
                    </button>
                </div>
            `;
            
            // attach select listener
            div.querySelector('.select-city-btn').addEventListener('click', () => {
                selectLocation(city.name, city.lat, city.lon, city.country, true);
            });
            
            // attach delete listener
            div.querySelector('.delete-city-btn').addEventListener('click', (e) => {
                const cityId = e.currentTarget.dataset.id;
                deleteCity(cityId);
            });
            
            // attach set default listener
            const setDefaultBtn = div.querySelector('.set-default-btn');
            if (setDefaultBtn && !isDefault) {
                setDefaultBtn.addEventListener('click', () => {
                    setDefaultCity(city);
                });
            }
            
            els.savedCitiesList.appendChild(div);
        });
    }

    function saveCity(cityData) {
        // prevent duplicates
        const exists = state.savedCities.some(c => c.id === cityData.id);
        if (exists) return;

        if (state.savedCities.length === 0) {
             setDefaultCity(cityData, false); 
        }

        state.savedCities.push(cityData);
        localStorage.setItem('savedCities', JSON.stringify(state.savedCities));
        renderSavedCities();
        updateCurrentLocBtnState();
    }

    function deleteCity(cityId) {
        state.savedCities = state.savedCities.filter(c => c.id !== cityId);
        localStorage.setItem('savedCities', JSON.stringify(state.savedCities));
        
        // if the deleted city was the default, reset default to New York
        if (state.defaultCity.id === cityId) {
            const newDefault = { lat: 40.7128, lon: -74.0060, name: "New York", country: "USA", id: "40.7128--74.0060" };
            setDefaultCity(newDefault);
            selectLocation(newDefault.name, newDefault.lat, newDefault.lon, newDefault.country, false);
        }

        renderSavedCities();
        updateCurrentLocBtnState();
    }

    // default city funvtions
    function setDefaultCity(cityData, shouldReRender = true) {
        state.defaultCity = {
            name: cityData.name,
            lat: cityData.lat,
            lon: cityData.lon,
            country: cityData.country,
            id: cityData.id
        };
        localStorage.setItem('defaultCity', JSON.stringify(state.defaultCity));
        if (shouldReRender) {
            renderSavedCities();
        }
    }

    // UI/event handlers

    function toggleMenu(show) {
        const shouldShow = show !== undefined ? show : els.sidebar.classList.contains('-translate-x-full');
        
        els.sidebar.classList.toggle('-translate-x-full', !shouldShow);
        els.overlay.classList.toggle('hidden', !shouldShow);
    }
    
    // tooltip functions
    function toggleDefaultCityTooltip(show) {
        const shouldShow = show !== undefined ? show : els.defaultCityTooltip.classList.contains('hidden');
        els.defaultCityTooltip.classList.toggle('hidden', !shouldShow);
        
        // save state to local storage to persist the dismissed state
        if (!shouldShow) {
            localStorage.setItem('defaultCityTooltipDismissed', 'true');
        }
    }

    function showTooltipOnLoad() {
        // show tooltip only if it hasn't been dismissed
        if (!localStorage.getItem('defaultCityTooltipDismissed')) {
            setTimeout(() => {
                 toggleDefaultCityTooltip(true);
            }, 500);
        }
    }
    
    // initial load function
    function initApp() {
        initUnitUI();
        renderSavedCities();
        
        // initial load uses the default city which was set at the top of the script
        selectLocation(state.defaultCity.name, state.defaultCity.lat, state.defaultCity.lon, state.defaultCity.country, false);
        
        // get current location information (but don't switch to it unless button is clicked)
        handleCurrentLocation();
        
        // show the default city explanation tooltip
        showTooltipOnLoad();

        // unit switching
        els.unitC.addEventListener('click', () => {
            state.unit = 'c';
            localStorage.setItem('weatherUnit', 'c');
            initUnitUI();
            fetchWeather();
        });
        
        els.unitF.addEventListener('click', () => {
            state.unit = 'f';
            localStorage.setItem('weatherUnit', 'f');
            initUnitUI();
            fetchWeather();
        });

        // search input with debounce
        let searchTimer;
        els.searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                searchCities(e.target.value);
            }, 300);
        });
        
        // current location & save
        els.btnCurrentLoc.addEventListener('click', () => {
             // only select location if it's already detected, otherwise run detection
             if (state.currentLocation) {
                 selectLocation(state.currentLocation.name, state.currentLocation.lat, state.currentLocation.lon, state.currentLocation.country);
             } else {
                 handleCurrentLocation();
             }
        });
        els.saveCurrentLocBtn.addEventListener('click', saveCurrentLocation);

        // mobile menu toggles
        els.menuBtn.addEventListener('click', () => toggleMenu(true));
        els.closeMenu.addEventListener('click', () => toggleMenu(false));
        els.overlay.addEventListener('click', () => toggleMenu(false));
        
        // default city tooltip
        els.defaultCityInfoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDefaultCityTooltip();
        });
        els.closeDefaultCityTooltip.addEventListener('click', () => toggleDefaultCityTooltip(false));
    }

    // expose selectLocation to global scope for inline usage
    window.selectLocation = selectLocation; 
    
    // start the app
    document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
